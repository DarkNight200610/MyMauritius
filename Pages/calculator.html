<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Mauritius</title>

    <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <defs>
        <clipPath id='c'>
            <circle cx='50' cy='50' r='50'/>
        </clipPath>
        </defs>
        <g clip-path='url(%23c)'>
        <rect width='100' height='25' y='0' fill='%23EA2839'/>
        <rect width='100' height='25' y='25' fill='%23003F87'/>
        <rect width='100' height='25' y='50' fill='%23FFD500'/>
        <rect width='100' height='25' y='75' fill='%2300A551'/>
        </g>
    </svg>">

    <!-- CSS -->
    <link rel="stylesheet" href="../Css/style.css">
    <link rel="stylesheet" href="../Css/calculator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="calculator-page">

<!--navbar-->
<div class="top-bar">
    <div class="nav-line"></div>
    <div class="nav-left logo"></div>

    <nav class="nav-center" id="navMenu">
        <a href="../index.html">Home</a>
        <a href="../index.html#cardsRowAnchor">Places</a>
        <a href="../index.html#bottom">About Us</a>
      <a href="contact.html">Contact</a>
        <a href="calculator.html">Calculator</a>

          <div class="login-dropdown">
            <a href="login.html" class="login-icon">
                <i class="fa-solid fa-user"></i>
            </a>
            <div class="dropdown-menu">
    </nav>
</div>

<!-- calculator page -->
<div class="calculator-container">
    <div class="calculator-header">
        <h1> Calculator</h1>
        <p>Perform basic arithmetic operations</p>
    </div>
    
    <div class="calculator-wrapper">
        <div class="calculator-box">
            <!-- display Screen -->
            <div class="calculator-display">
                <div class="previous-operation" id="previousOperation"></div>
                <div class="current-operation" id="currentOperation">0</div>
            </div>
            
            <!-- calculator Buttons -->
            <div class="calculator-buttons">
                <!-- Row 1 -->
                <button class="calc-btn operator-btn" data-action="clear">
                    <i class="fas fa-backspace"></i>
                </button>
                <button class="calc-btn operator-btn" data-action="clear-all">
                    C
                </button>
                <button class="calc-btn operator-btn" data-action="percentage">
                    %
                </button>
                <button class="calc-btn operator-btn" data-action="divide">
                    ÷
                </button>
                
                <!-- Row 2 -->
                <button class="calc-btn number-btn" data-number="7">
                    7
                </button>
                <button class="calc-btn number-btn" data-number="8">
                    8
                </button>
                <button class="calc-btn number-btn" data-number="9">
                    9
                </button>
                <button class="calc-btn operator-btn" data-action="multiply">
                    ×
                </button>
                
                <!-- Row 3 -->
                <button class="calc-btn number-btn" data-number="4">
                    4
                </button>
                <button class="calc-btn number-btn" data-number="5">
                    5
                </button>
                <button class="calc-btn number-btn" data-number="6">
                    6
                </button>
                <button class="calc-btn operator-btn" data-action="subtract">
                    -
                </button>
                
                <!-- Row 4 -->
                <button class="calc-btn number-btn" data-number="1">
                    1
                </button>
                <button class="calc-btn number-btn" data-number="2">
                    2
                </button>
                <button class="calc-btn number-btn" data-number="3">
                    3
                </button>
                <button class="calc-btn operator-btn" data-action="add">
                    +
                </button>
                
                <!-- Row 5 -->
                <button class="calc-btn number-btn" data-number="0">
                    0
                </button>
                <button class="calc-btn" data-action="decimal">
                    .
                </button>
                <button class="calc-btn equals-btn" data-action="equals">
                    =
                </button>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script src="../Scripts/calculator.js"></script>

</body>
</html>
